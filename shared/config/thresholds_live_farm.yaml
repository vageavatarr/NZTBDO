version: 1
perception:
  detection_confidence_min: 0.6
  engage_confidence_min: 0.7
  near_radius_m: 8.0
  front_cone_angle_deg: 85
  front_cone_range_m: 7.0
  runtime:
    detector_backend: auto
    model_path: data/models/enemy_detector.pt
    confidence_min: 0.5
    pixel_to_meter: 0.01
    max_targets: 8
    enemy_class_ids: []

combat:
  clear_timeout_sec: 2.2
  progress_timeout_sec: 10.0
  action_rate_limit_hz: 6

navigation:
  stuck_timeout_sec: 5.0
  waypoint_reacquire_max_m: 18.0

input_control:
  dry_run: false
  require_foreground_window: false
  bind_to_process: true
  allow_background_input: true
  allowed_window_titles:
    - Black Desert
  allowed_process_names:
    - BlackDesert64
